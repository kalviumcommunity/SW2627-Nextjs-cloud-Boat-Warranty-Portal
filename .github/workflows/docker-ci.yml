name: Boat warranty Hub docker Build

run-name: ${{github.actor}} triggered the Docker build

on:
  push:
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: boat-warranty-hub

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3