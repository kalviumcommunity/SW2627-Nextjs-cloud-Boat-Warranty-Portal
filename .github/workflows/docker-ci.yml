name: Docker CI — boAt Warranty Hub

run-name: "${{ github.actor }} → Docker CI on ${{ github.ref_name }}"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancel stale runs on the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/boat-warranty-hub

jobs:
  ci:
    name: CI/CD Pipeline
    runs-on: ubuntu-latest

    # Needed to push the image to GitHub Container Registry (GHCR).
    # GITHUB_TOKEN is automatically provided — no manual secrets required.
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: boat-warranty-hub

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://ci_user:ci_password@localhost:5432/ci_db"
      NEXTAUTH_SECRET: "ci-secret-key-32-characters-minimum-length-for-nextauth"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup + dependency cache ───────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: boat-warranty-hub/package-lock.json

      - name: Install Dependencies
        run: npm install --prefer-dedupe

      # ── 3. Prisma Generate ────────────────────────────────────────────
      - name: Prisma Generate
        run: npx prisma generate

      # ── 4. Run Tests ──────────────────────────────────────────────────
      - name: Run Tests
        run: npm run test

      # ── 5. Run Lint ───────────────────────────────────────────────────
      - name: Run Lint
        run: npm run lint

      # ── 6. Docker Buildx ──────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR — uses the auto-provided GITHUB_TOKEN, no secrets setup needed
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 7. Build Docker Image ─────────────────────────────────────────
      # load: true → image is loaded into the local Docker daemon for Trivy scanning.
      # Layers are also cached in GitHub Actions for fast subsequent builds.
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./boat-warranty-hub
          file: ./boat-warranty-hub/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 8. Trivy Security Scan ────────────────────────────────────────
      # Scans the built image for CRITICAL and HIGH vulnerabilities.
      # Only fails on fixable issues — ignores vulnerabilities with no fix available.
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # ── 9. Push Image to Registry ─────────────────────────────────────
      # Only push on direct pushes to main/master — not on pull requests.
      # Tags: commit SHA (immutable) + latest (floating pointer).
      # All layers are already cached so this rebuild is near-instant.
      - name: Push Image to Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v6
        with:
          context: ./boat-warranty-hub
          file: ./boat-warranty-hub/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max