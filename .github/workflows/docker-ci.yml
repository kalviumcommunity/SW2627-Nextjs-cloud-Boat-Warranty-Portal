name: Boat warranty Hub docker Build

run-name: ${{github.actor}} triggered the Docker build

on:
  push:
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: boat-warranty-hub

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./boat-warranty-hub
          file: ./boat-warranty-hub/Dockerfile
          push: false
          tags: boat-warranty-hub:ci