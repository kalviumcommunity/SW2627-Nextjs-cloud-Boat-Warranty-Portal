name: Docker CI

run-name: "${{ github.actor }} → Docker CI on ${{ github.ref_name }}"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build & Validate Docker Image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./boat-warranty-hub

    steps:
      # ─────────────────────────────────────────────
      # Checkout Repository
      # ─────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # Setup Node.js
      # ─────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: boat-warranty-hub/package-lock.json

      # ─────────────────────────────────────────────
      # Install Dependencies
      # ─────────────────────────────────────────────
      - name: Install Dependencies
        run: npm install --prefer-dedupe

      # ─────────────────────────────────────────────
      # Generate Prisma Client
      # ─────────────────────────────────────────────
      - name: Generate Prisma Client
        run: npx prisma generate

      # ─────────────────────────────────────────────
      # Setup Docker Buildx
      # ─────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─────────────────────────────────────────────
      # Validate docker-compose.yml
      # ─────────────────────────────────────────────
      - name: Validate Docker Compose
        run: docker compose config > /dev/null

      # ─────────────────────────────────────────────
      # Build Docker Image
      # ─────────────────────────────────────────────
      - name: Build Docker Image
        run: docker build -t boat-warranty-hub:ci .