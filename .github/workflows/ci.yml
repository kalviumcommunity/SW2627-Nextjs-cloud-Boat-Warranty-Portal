name: Boat Warranty Hub Integration Pipeline

run-name: ${{ github.actor }} triggered the CI pipeline

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: boat-warranty-hub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'boat-warranty-hub/package-lock.json'

      - name: Install Dependencies
        # npm ci fails cross-platform because package-lock.json is generated on Windows
        # and does not include Linux-specific optional native binaries (@emnapi/core,
        # @emnapi/runtime) needed by @napi-rs/wasm-runtime and @img/sharp-wasm32.
        # npm install correctly resolves all platform-specific optional deps on each runner.
        run: npm install --prefer-dedupe

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build