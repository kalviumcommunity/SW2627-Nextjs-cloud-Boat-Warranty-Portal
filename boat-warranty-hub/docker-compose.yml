version: "3.9"

services:

  db:

    image: postgres:17-alpine

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: boat_warranty_hub

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  app:

    build: .

    depends_on:
      - db

    environment:

      DATABASE_URL: postgresql://postgres:postgres@db:5432/boat_warranty_hub?schema=public

      NEXTAUTH_SECRET: your-secret

      NEXTAUTH_URL: http://localhost:3000

    ports:
      - "3000:3000"

volumes:

  postgres_data: