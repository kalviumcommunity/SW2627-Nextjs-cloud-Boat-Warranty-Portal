# =====================================================
# docker-compose.prod.yml — boAt Warranty Hub
# Standalone production compose (no base file merge needed)
# =====================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Requires a .env file with DATABASE_URL, NEXTAUTH_SECRET, etc.
# GCS credentials are mounted read-only from ./credentials/
# =====================================================

services:
  database:
    image: postgres:17-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Database port NOT exposed in production (internal only)

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      # GCS service account key — read-only mount, never baked into image
      - ./credentials:/app/credentials:ro
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
